<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexIT — IT Asset Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css?v=9" />
</head>
<body>

<!-- Sidebar Navigation -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">⬡</div>
    <div class="brand-text">
      <span class="brand-name">NexIT</span>
      <span class="brand-sub">IT Asset Inventory v1.0</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-group">
      <span class="nav-group-label">Overview</span>
      <a href="#" class="nav-item active" data-module="dashboard">
        <span class="nav-icon">◈</span> Dashboard
      </a>
    </div>

    <div class="nav-group">
      <span class="nav-group-label">Infrastructure</span>
      <a href="#" class="nav-item" data-module="inventory">
        <span class="nav-icon">◫</span> Inventory
        <span class="nav-badge">Intune</span>
      </a>
      <a href="#" class="nav-item" data-module="replacements">
        <span class="nav-icon">⇄</span> Device Replacement History
      </a>
      <a href="#" class="nav-item" data-module="reports">
        <span class="nav-icon">◪</span> Weekly Reports
      </a>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">IT</div>
      <div>
        <div class="user-name">IT Admin</div>
        <div class="user-role">Administrator</div>
      </div>
    </div>
  </div>
</aside>

<!-- Mobile Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Main Content -->
<main class="main-content" id="mainContent">

  <!-- Top Bar -->
  <header class="topbar">
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-title" id="topbarTitle">Dashboard</div>
    <div class="topbar-actions">
      <select class="country-filter" id="globalCountryFilter">
        <option value="all">🌐 All Countries</option>
        <option value="SG">🇸🇬 Singapore</option>
        <option value="MY">🇲🇾 Malaysia</option>
        <option value="TH">🇹🇭 Thailand</option>
        <option value="PH">🇵🇭 Philippines</option>
        <option value="ID">🇮🇩 Indonesia</option>
        <option value="AU">🇦🇺 Australia</option>
        <option value="US">🇺🇸 United States</option>
      </select>
    </div>
  </header>

  <!-- Module Container -->
  <div class="module-container" id="moduleContainer">
    <!-- Modules are injected by JS -->
  </div>

</main>

<!-- Global Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="globalModal">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalConfirm">Save</button>
    </div>
  </div>
</div>

<!-- Toast Notifications -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script>
<script src="app.js?v=8" defer></script>
<script src="dashboard.js?v=12" defer></script>
<script src="inventory.js?v=12" defer></script>
<script src="replacement-history.js?v=5" defer></script>
<script src="reports.js?v=2" defer></script>
</body>
</html>
