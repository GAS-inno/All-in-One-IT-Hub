<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>NexIT — IT Asset Inventory</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('nexit-theme');
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css?v=34" />
</head>
<body>

<!-- Sidebar Navigation -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">⬡</div>
    <div class="brand-text">
      <span class="brand-name">NexIT</span>
      <span class="brand-sub">IT Asset Inventory v1.0</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-group">
      <span class="nav-group-label">Overview</span>
      <a href="#" class="nav-item active" data-module="dashboard">
        <span class="nav-icon">◈</span> Dashboard
      </a>
    </div>

    <div class="nav-group">
      <span class="nav-group-label">Infrastructure</span>
      <a href="#" class="nav-item" data-module="inventory">
        <span class="nav-icon">◫</span> Inventory
      </a>
      <div class="device-type-nav" id="deviceTypeNav" aria-label="Inventory device types"></div>
      <a href="#" class="nav-item" data-module="users">
        <span class="nav-icon">♙</span> Users
      </a>
      <a href="#" class="nav-item" data-module="replacements">
        <span class="nav-icon">⇄</span> Device Replacement History
      </a>
      <a href="#" class="nav-item" data-module="access" id="accessNavItem" hidden>
        <span class="nav-icon">🔐</span> User Management
      </a>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar" id="sidebarUserAvatar">IT</div>
      <div>
        <div class="user-name" id="sidebarUserName">—</div>
        <div class="user-role" id="sidebarUserRole">Not signed in</div>
      </div>
    </div>
  </div>
</aside>

<!-- Mobile Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Main Content -->
<main class="main-content" id="mainContent">

  <!-- Top Bar -->
  <header class="topbar">
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-title" id="topbarTitle">Dashboard</div>
    <div class="topbar-actions">
      <span id="globalCountryFlag" class="country-flag-display" aria-hidden="true"></span>
      <select class="country-filter" id="globalCountryFilter" aria-label="Country filter">
        <option value="all">All Countries</option>
        <option value="SG">Singapore</option>
        <option value="AU">Australia</option>
        <option value="MY">Malaysia</option>
        <option value="TH">Thailand</option>
        <option value="IN">India</option>
        <option value="ID">Indonesia</option>
        <option value="VN">Vietnam</option>
        <option value="PH">Philippines</option>
        <option value="JP">Japan</option>
      </select>
      <button type="button" class="btn btn-secondary btn-sm theme-toggle" id="themeToggle" aria-label="Toggle color theme" title="Toggle color theme">Theme</button>
      <details class="inventory-settings-dropdown global-more-tools" id="globalMoreTools">
        <summary class="btn btn-secondary btn-sm" aria-label="More tools">More tools</summary>
        <div class="inventory-settings-menu" aria-label="More tools">
          <button type="button" class="inventory-settings-action" id="globalBackupDatabaseBtn">Backup Database</button>
          <button type="button" class="inventory-settings-action" id="globalRestoreDatabaseBtn">Restore Database</button>
          <button type="button" class="inventory-settings-action" id="globalCleanDatabaseBtn">Clean Database</button>
          <button type="button" class="inventory-settings-action" id="globalExportCsvBtn">Export CSV</button>
          <button type="button" class="inventory-settings-action" id="globalImportCsvBtn">Import CSV</button>
          <button type="button" class="inventory-settings-action" id="globalDownloadCsvTemplateBtn">Download CSV template</button>
        </div>
      </details>
      <button type="button" class="btn btn-secondary btn-sm" id="logoutBtn" hidden>Logout</button>
      <input id="globalDatabaseRestoreInput" type="file" accept=".db,.sqlite,.sqlite3,application/vnd.sqlite3" hidden />
      <input id="globalInventoryImportInput" type="file" accept=".csv,text/csv" hidden />
      <input id="globalUsersImportInput" type="file" accept=".csv,text/csv" hidden />
    </div>
  </header>

  <!-- Module Container -->
  <div class="module-container" id="moduleContainer">
    <!-- Modules are injected by JS -->
  </div>

</main>

<!-- Global Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="globalModal">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalConfirm">Save</button>
    </div>
  </div>
</div>

<!-- Login Screen -->
<div class="auth-overlay" id="authOverlay" hidden>
  <form class="auth-card" id="loginForm" autocomplete="on">
    <div class="auth-brand">
      <div class="brand-icon">⬡</div>
      <div>
        <div class="auth-title">NexIT</div>
        <div class="auth-subtitle">Internal IT sign-in</div>
      </div>
    </div>
    <p class="auth-note">Sign in with your internal account. Accounts are created by administrators.</p>
    <label class="auth-field">
      <span>Username</span>
      <input id="loginUsername" name="username" type="text" autocomplete="username" required />
    </label>
    <label class="auth-field">
      <span>Password</span>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
    </label>
    <div class="auth-error" id="loginError" role="alert" aria-live="polite"></div>
    <button type="submit" class="btn btn-primary auth-submit" id="loginSubmit">Sign in</button>
  </form>
</div>

<!-- Toast Notifications -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script>
<script src="country-flags.js?v=1" defer></script>
<script src="date-utils.js?v=2" defer></script>
<script src="app.js?v=26" defer></script>
<script src="dashboard.js?v=19" defer></script>
<script src="constants.js?v=1" defer></script>
<script src="inventory.js?v=62" defer></script>
<script src="users.js?v=17" defer></script>
<script src="replacement-history.js?v=14" defer></script>
</body>
</html>
